name: Publish Armwrestling LAB

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Read GitHub Pages configuration
        id: pages
        uses: actions/configure-pages@v5
      - name: Build for the actual Pages URL
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          # Pages may report HTTP while the custom-domain certificate is pending.
          SITE_URL="$(python -c 'import os; from urllib.parse import urlsplit; print(urlsplit(os.environ["SITE_URL"])._replace(scheme="https").geturl())')"
          python scripts/build.py --site-url "$SITE_URL"
      - name: Check every local link and article
        run: python scripts/check.py
      - name: Run source and deployment regression tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Package only the public site
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
